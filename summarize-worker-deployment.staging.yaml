apiVersion: apps/v1
kind: Deployment
metadata:
  name: summarize-worker
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: summarize-worker
  template:
    metadata:
      labels:
        app: summarize-worker
    spec:
      containers:
        # Cloud SQL Proxy sidecar
        - name: cloud-sql-proxy
          image: gcr.io/cloudsql-docker/gce-proxy:1.33.2
          command:
            - /cloud_sql_proxy
            - -instances=golden-cosmos-450417-i8:us-central1:testifi=tcp:3306
            - -credential_file=/secrets/cloudsql/credentials.json
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: cloudsql-instance-credentials
              mountPath: /secrets/cloudsql
              readOnly: true

        # Summarize Worker
        - name: summarize-worker
          image: gcr.io/golden-cosmos-450417-i8/summarize-worker:latest
          command:
            - node
            - dist/worker/summarizeWorker.js
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: gcp-service-account
              mountPath: /var/secrets/google
              readOnly: true
            - name: cloudsql-instance-credentials
              mountPath: /secrets/cloudsql
              readOnly: true

          env:
            - name: NODE_ENV
              value: "staging"
            - name: DB_HOST
              value: "127.0.0.1"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/google/key.json
            
            # Worker tuning
            - name: WORKER_CONCURRENCY
              value: "1"  # Sequential processing to avoid rate limits
            - name: PAGE_RANGE_SIZE
              value: "5"  # Pages per chunk
            
            # Database connection
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DATABASE_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_NAME
            
            # Email
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SENDGRID_API_KEY
            - name: BREVO_SENDER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: EMAIL_USER
            
            # ---------- Azure OpenAI (STAGING - GPT-5) ----------
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: AZURE_OPENAI_API_KEY
            - name: AZURE_OPENAI_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: AZURE_OPENAI_ENDPOINT
            # Staging uses GPT-5 (same as production, can be upgraded to test newer models first)
            - name: AZURE_OPENAI_DEPLOYMENT_NAME
              value: "gpt-5-testifi"  # Same as production for now
            - name: AZURE_API_VERSION
              value: "2025-01-01-preview"  # Latest API version

      volumes:
        - name: cloudsql-instance-credentials
          secret:
            secretName: your-cloudsql-credentials
        - name: gcp-service-account
          secret:
            secretName: service-account-json

