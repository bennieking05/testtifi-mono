steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/testifi-frontend:${_TAG}'
      - '-f'
      - 'Dockerfile.cloudrun'
      - '--build-arg'
      - 'VITE_API_URL=${_VITE_API_URL}'
      - '--build-arg'
      - 'VITE_STRIPE_PUBLISHABLE_KEY=${_VITE_STRIPE_PUBLISHABLE_KEY}'
      - '.'
    dir: 'loveable'
images:
  - 'gcr.io/${PROJECT_ID}/testifi-frontend:${_TAG}'
substitutions:
  _TAG: staging
  _VITE_API_URL: https://testifi-backend-staging-748916208557.us-central1.run.app
  _VITE_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
