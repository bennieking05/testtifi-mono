steps:
  # Build backend (tag with BUILD_ID and latest)
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "gcr.io/golden-cosmos-450417-i8/testifi-backend:$BUILD_ID",
        "-t",
        "gcr.io/golden-cosmos-450417-i8/testifi-backend:latest",
        "--target=backend",
        ".",
      ]

  # Build summarize-worker (tag with BUILD_ID and latest)
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "gcr.io/golden-cosmos-450417-i8/summarize-worker:$BUILD_ID",
        "-t",
        "gcr.io/golden-cosmos-450417-i8/summarize-worker:latest",
        "--target=summarize-worker",
        ".",
      ]

  # Push both images (both tags)
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/golden-cosmos-450417-i8/testifi-backend:$BUILD_ID"]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/golden-cosmos-450417-i8/testifi-backend:latest"]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/golden-cosmos-450417-i8/summarize-worker:$BUILD_ID"]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/golden-cosmos-450417-i8/summarize-worker:latest"]

  # ===== Deploy to GKE (pin to this build's tag) =====
  - id: "Deploy to GKE (pin and rollouts)"
    name: "gcr.io/cloud-builders/gke-deploy"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        echo "Getting GKE credentials for ${_CLUSTER} in ${_CLUSTER_LOCATION}..."
        gcloud container clusters get-credentials "${_CLUSTER}" --zone "${_CLUSTER_LOCATION}"
        echo "Updating backend image to $BUILD_ID..."
        kubectl -n "${_NAMESPACE}" set image deployment/backend backend=gcr.io/golden-cosmos-450417-i8/testifi-backend:$BUILD_ID
        kubectl -n "${_NAMESPACE}" rollout status deployment/backend --timeout=300s

        echo "Rolling summarize-worker with scale-to-zero to avoid CPU surge..."
        kubectl -n "${_NAMESPACE}" scale deployment summarize-worker --replicas=0
        kubectl -n "${_NAMESPACE}" set image deployment/summarize-worker summarize-worker=gcr.io/golden-cosmos-450417-i8/summarize-worker:$BUILD_ID
        kubectl -n "${_NAMESPACE}" scale deployment summarize-worker --replicas=1
        kubectl -n "${_NAMESPACE}" rollout status deployment/summarize-worker --timeout=600s

images:
  - "gcr.io/golden-cosmos-450417-i8/testifi-backend:$BUILD_ID"
  - "gcr.io/golden-cosmos-450417-i8/testifi-backend:latest"
  - "gcr.io/golden-cosmos-450417-i8/summarize-worker:$BUILD_ID"
  - "gcr.io/golden-cosmos-450417-i8/summarize-worker:latest"

substitutions:
  _CLUSTER: testifi
  _CLUSTER_LOCATION: us-central1-c
  _NAMESPACE: staging

options:
  logging: CLOUD_LOGGING_ONLY

# Explicitly set logs bucket to satisfy service account requirement
logsBucket: 'gs://golden-cosmos-450417-i8_cloudbuild'

# Force Cloud Build default service account (not Compute Engine SA)
serviceAccount: projects/golden-cosmos-450417-i8/serviceAccounts/748916208557@cloudbuild.gserviceaccount.com
