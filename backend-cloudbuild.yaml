steps:
  # Build backend
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "gcr.io/golden-cosmos-450417-i8/testifi-backend:$BUILD_ID",
        "--target=backend",
        ".",
      ]

  # Build summarize-worker
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "gcr.io/golden-cosmos-450417-i8/summarize-worker:$BUILD_ID",
        "--target=summarize-worker",
        ".",
      ]

  # Push both images
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/golden-cosmos-450417-i8/testifi-backend:$BUILD_ID"]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/golden-cosmos-450417-i8/summarize-worker:$BUILD_ID"]


images:
  - "gcr.io/golden-cosmos-450417-i8/testifi-backend:$BUILD_ID"
  - "gcr.io/golden-cosmos-450417-i8/summarize-worker:$BUILD_ID"

options:
  logging: CLOUD_LOGGING_ONLY

serviceAccount: "projects/golden-cosmos-450417-i8/serviceAccounts/748916208557-compute@developer.gserviceaccount.com"
