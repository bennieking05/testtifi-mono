apiVersion: apps/v1
kind: Deployment
metadata:
  name: summarize-worker
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: summarize-worker
  template:
    metadata:
      labels:
        app: summarize-worker
    spec:
      # ──────────── Side‑car: Cloud SQL Proxy ────────────
      containers:
        - name: cloud-sql-proxy
          image: gcr.io/cloudsql-docker/gce-proxy:1.33.2
          command:
            - "/cloud_sql_proxy"
            - "-instances=golden-cosmos-450417-i8:us-central1:testifi=tcp:3306"
            - "-credential_file=/secrets/cloudsql/credentials.json"
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "200m" }
          volumeMounts:
            - name: cloudsql-instance-credentials
              mountPath: /secrets/cloudsql
              readOnly: true

        # ──────────── Main worker container ────────────
        - name: summarize-worker
          image: gcr.io/golden-cosmos-450417-i8/testifi-backend:latest
          command: ["node", "dist/worker/summarizeWorker.js"]

          resources:
            requests: { memory: "512Mi", cpu: "250m" }
            limits: { memory: "1024Mi", cpu: "500m" }

          # Inject EVERY key from backend‑secrets
          envFrom:
            - secretRef:
                name: backend-secrets

          # Add/override vars that are **not** in the secret
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST # local Cloud SQL Proxy
              value: "127.0.0.1"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/google/key.json

          volumeMounts:
            - name: gcp-service-account
              mountPath: /var/secrets/google
              readOnly: true
            - name: cloudsql-instance-credentials
              mountPath: /secrets/cloudsql
              readOnly: true

      # ───────────────────── Volumes ─────────────────────
      volumes:
        - name: cloudsql-instance-credentials
          secret:
            secretName: your-cloudsql-credentials # ↳ already exists

        - name: gcp-service-account
          secret:
            secretName: service-account-json # ↳ same one backend uses
