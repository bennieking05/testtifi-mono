apiVersion: apps/v1
kind: Deployment
metadata:
  name: summarize-worker
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: summarize-worker
  template:
    metadata:
      labels:
        app: summarize-worker
    spec:
      containers:
        # ─────────────── Side-car: Cloud SQL Proxy ───────────────
        - name: cloud-sql-proxy
          image: gcr.io/cloudsql-docker/gce-proxy:1.33.2
          command:
            - "/cloud_sql_proxy"
            - "-instances=golden-cosmos-450417-i8:us-central1:testifi=tcp:3306"
            - "-credential_file=/secrets/cloudsql/credentials.json"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: cloudsql-instance-credentials
              mountPath: /secrets/cloudsql
              readOnly: true

        # ─────────────── Main summarize-worker container ───────────────
        - name: summarize-worker
          image: gcr.io/golden-cosmos-450417-i8/summarize-worker:latest
          command: ["node", "dist/worker/summarizeWorker.js"]
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
          envFrom:
            - secretRef:
                name: backend-secrets
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              value: "127.0.0.1"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/google/key.json
            - name: WORKER_CONCURRENCY
              value: "6"
            - name: PAGE_RANGE_SIZE
              value: "3"
          volumeMounts:
            - name: gcp-service-account
              mountPath: /var/secrets/google
              readOnly: true
            - name: cloudsql-instance-credentials
              mountPath: /secrets/cloudsql
              readOnly: true

      volumes:
        - name: cloudsql-instance-credentials
          secret:
            secretName: your-cloudsql-credentials
        - name: gcp-service-account
          secret:
            secretName: service-account-json
