apiVersion: apps/v1
kind: Deployment
metadata:
  name: summarize-worker
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: summarize-worker
  template:
    metadata:
      labels:
        app: summarize-worker
    spec:
      containers:
        - name: cloud-sql-proxy
          image: gcr.io/cloudsql-docker/gce-proxy:1.33.2
          command:
            - "/cloud_sql_proxy"
            - "-instances=golden-cosmos-450417-i8:us-central1:testifi=tcp:3306"
            - "-credential_file=/secrets/cloudsql/credentials.json"
          volumeMounts:
            - name: cloudsql-instance-credentials
              mountPath: /secrets/cloudsql
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"

        - name: summarize-worker
          image: gcr.io/golden-cosmos-450417-i8/testifi-backend:latest
          command: ["node", "dist/worker/summarizeWorker.js"]
          resources:
            requests:
              memory: "192Mi"
              cpu: "150m"
            limits:
              memory: "384Mi"
              cpu: "300m"
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DATABASE_URL
            - name: DB_HOST
              value: "127.0.0.1"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_NAME
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SENDGRID_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: OPENAI_API_KEY
            - name: BREVO_SENDER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: EMAIL_USER
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_SECRET
            - name: BASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: BASE_URL
            - name: BACKEND_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: BACKEND_URL
            - name: STRIPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: STRIPE_API_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: AZURE_OPENAI_API_KEY
            - name: AZURE_OPENAI_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: AZURE_OPENAI_ENDPOINT
            - name: AZURE_OPENAI_DEPLOYMENT_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: AZURE_OPENAI_DEPLOYMENT_NAME
            - name: AZURE_API_VERSION
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: AZURE_API_VERSION
          volumeMounts:
            - name: cloudsql-instance-credentials
              mountPath: /secrets/cloudsql
              readOnly: true

      volumes:
        - name: cloudsql-instance-credentials
          secret:
            secretName: your-cloudsql-credentials
