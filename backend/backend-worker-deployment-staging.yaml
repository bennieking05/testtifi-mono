apiVersion: apps/v1
kind: Deployment
metadata:
  name: summarize-worker-staging
  namespace: default
  labels:
    app: summarize-worker-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: summarize-worker-staging
  template:
    metadata:
      labels:
        app: summarize-worker-staging
    spec:
      containers:
        - name: cloud-sql-proxy
          image: gcr.io/cloudsql-docker/gce-proxy:1.33.2
          command:
            - "/cloud_sql_proxy"
            - "-instances=golden-cosmos-450417-i8:us-central1:testifi=tcp:3306"
            - "-credential_file=/secrets/cloudsql/credentials.json"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: cloudsql-instance-credentials
              mountPath: /secrets/cloudsql
              readOnly: true
        - name: summarize-worker
          image: ghcr.io/bennieking05/summarize-worker:staging
          command: ["node", "dist/worker/summarizeWorker.js"]
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
          envFrom:
            - secretRef:
                name: backend-secrets
          env:
            - name: NODE_ENV
              value: "staging"
            - name: DB_HOST
              value: "127.0.0.1"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/google/key.json
          volumeMounts:
            - name: gcp-service-account
              mountPath: /var/secrets/google
              readOnly: true
            - name: cloudsql-instance-credentials
              mountPath: /secrets/cloudsql
              readOnly: true
      volumes:
        - name: cloudsql-instance-credentials
          secret:
            secretName: your-cloudsql-credentials
        - name: gcp-service-account
          secret:
            secretName: service-account-json
