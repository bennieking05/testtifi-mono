name: Playwright Regression Gate

on:
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  regression:
    name: Playwright Regression + Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright regression tests
        run: npx playwright test tests/regression/ --reporter=list,json
        env:
          BASE_URL: ${{ vars.STAGING_FRONTEND_URL || 'https://staging.app.testifi.ai' }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/playwright-report.json

      - name: Run evidence screenshots
        if: always()
        run: npx playwright test tests/evidence/ --reporter=list
        env:
          BASE_URL: ${{ vars.STAGING_FRONTEND_URL || 'https://staging.app.testifi.ai' }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          FEATURE_NAME: pr-${{ github.event.pull_request.number }}
          EVIDENCE_TS: ${{ github.run_id }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 14

      - name: Upload evidence screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-screenshots
          path: tests/regression-screenshots/
          retention-days: 14
